name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - run: npm ci
      - run: npm run test:sdk
      - run: forge fmt --check
      - run: forge test -vvv
      - run: bash -n scripts/*.sh
