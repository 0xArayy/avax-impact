name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - run: npm ci
      - run: npm ci
        working-directory: demo
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$RELEASE_TAG" = "v$(node -p "require('./packages/sdk/package.json').version")"
      - run: npm audit --audit-level=high
      - run: npm audit --audit-level=high
        working-directory: demo
      - run: npm run check
      - run: npm run verify:fuji
      - run: npm run verify:compatibility
      - run: mkdir release-artifacts
      - run: npm pack --workspace @avax-impact/sdk --pack-destination release-artifacts
      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --verify-tag --generate-notes
