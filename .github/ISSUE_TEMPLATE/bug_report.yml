name: Bug report
description: Report a reproducible non-sensitive defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, Foundry, network, wallet, and RPC details with secrets removed.
